name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI can read the code and nothing else.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs, not movable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # .npmrc sets ignore-scripts, so no package can run code on install.
      - run: npm ci
      - name: Dependency audit and registry signatures
        run: npm run audit:deps
      - name: Install test browsers (WebKit = Safari's engine)
        run: npx playwright install --with-deps webkit chromium
      - name: Type check, unit tests, build, browser tests
        run: npm run verify
